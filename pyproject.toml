[project]
name = "ytop"
version = "0.3.0"
description = "Offline preserver for YouTube playlists"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bgutil-ytdlp-pot-provider>=2.0.2",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "yt-dlp>=2025.1",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "youtube-transcript-api>=1.0",
    "yt-dlp-ejs==0.8.0",
    "secretstorage>=3.3 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["httpx>=0.27", "mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[project.scripts]
ytop = "ytop.cli:main"
ytop-doctor = "ytop.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytop"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Focused correctness rules; formatting is not enforced repository-wide.
select = ["E9", "F63", "F7", "F82", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/ytop/instance.py", "src/ytop/index.py", "src/ytop/tags.py", "src/ytop/web/fsops.py", "src/ytop/web/browse.py", "src/ytop/yt/metadata.py", "src/ytop/layout.py", "src/ytop/fsnames.py", "src/ytop/fsinfo.py", "src/ytop/publish.py", "src/ytop/libraries.py", "src/ytop/migrate.py", "src/ytop/runtime.py", "src/ytop/makestick.py", "src/ytop/manifest.py", "src/ytop/stick/boot.py", "src/ytop/startup.py", "src/ytop/product.py", "src/ytop/components.py", "src/ytop/updater.py", "src/ytop/bgserver.py", "src/ytop/autoupdate.py", "src/ytop/appupdate.py", "src/ytop/yt/runner.py", "src/ytop/timing.py", "src/ytop/parallel.py", "src/ytop/stickplatforms.py", "tools/ffmpeg-minimal/verify.py", "tools/build_stick.py", "tools/smoke_stick.py", "tools/package_release.py", "tools/ci_fake_release.py", "tools/fake_release_server.py"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
