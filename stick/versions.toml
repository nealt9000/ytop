# Pinned sources for the YTOP stick image (tools/build_stick.py).
# Every artifact is verified against its sha256 before use. The yt-dlp-ejs
# version is pinned by uv.lock, not here.
#
# The build also seeds the component store (.ytop/components, see
# src/ytop/components.py) with the Python components it installed (uv.lock
# pins yt-dlp, yt-dlp-ejs, the bgutil plugin, youtube-transcript-api);
# lib/common keeps the same versions as the always-present fallback. Deno is
# not seeded (size budget): [deno] below pins runtime/<plat>/bin/deno, which
# is used until the updater puts a newer Deno in the store.
#
# The bgutil PO-token server (the plugin's Deno provider runs its
# src/generate_once.ts) is the upstream tag tarball, whose tag must equal the
# bgutil plugin version uv.lock pins (the build refuses a mismatch).  The build
# runs `deno install` in server/ with the pinned Deno, keeps only pure
# JavaScript (it fails on any native binary or symlink), and seeds it into the
# component store.  The sha256 below is of GitHub's generated tag archive,
# recorded when the pin was made; the server is GPL-3.0-only (its LICENSE is
# seeded beside it).
#
# Linux floor: glibc 2.28, set by the dependency wheels (installed for
# manylinux_2_28, see UV_TRIPLES in build_stick.py). Python needs 2.17, Deno 2.27.

[python]
version = "3.12.15"
build = "20261021"

[deno]
version = "2.9.8"

[ffmpeg_minimal]
release = "ffmpeg-minimal-1"  # this repo's release; a GitHub token is used if one is at hand

