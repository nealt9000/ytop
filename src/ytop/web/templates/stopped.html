<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ product_name }} has stopped</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f0f10; color: #f1f1f1;
    }
    main { max-width: 32rem; padding: 24px; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: #b5b5b5; margin: 0; }
    @media (prefers-color-scheme: light) {
      body { background: #fafafa; color: #111; }
      p { color: #555; }
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ product_name }} has stopped. It's safe to unplug.</h1>
    <p>You can close this tab. Start {{ product_name }} again from the stick to keep watching.</p>
  </main>
</body>
</html>
