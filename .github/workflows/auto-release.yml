name: Auto release

# Every push to main that CI passes is considered for a release.
# tools/next_version.py decides from the commits since the last vX.Y.Z tag
# whether shipped files changed and what the next version is.  The version
# bump is committed in the runner only; the stick image is built from that
# commit and smoke-tested, and only then are the bump commit and the tag
# pushed (atomically) and the GitHub release published.  A failure before
# publish leaves no commit, tag or release behind.
#
# A manual run with dry_run (the default) does everything except push and
# publish.  Hand-pushed tags still release through release.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan, bump, build and package only; push and publish nothing
        type: boolean
        default: true

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

# Explicit bash adds pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  plan:
    # The bot's own bump commits are pushed with GITHUB_TOKEN and start no
    # workflows; the chore(release): check is a second guard against a loop.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Decide whether to release, and the version
        id: plan
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main" != "$SHA" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "# superseded: main is at $main, not $SHA; no release" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/next_version.py plan \
            --github-output "$GITHUB_OUTPUT" --notes-file notes.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the release notes
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          retention-days: 7
          if-no-files-found: error

  bump:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Commit the version bump (in this runner only)
        run: |
          python3 tools/next_version.py write "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c release
          git add pyproject.toml src/ytop/__init__.py uv.lock
          { printf 'chore(release): v%s\n\n' "$VERSION"; cat notes.md; } > "$RUNNER_TEMP/msg"
          # verbatim: the notes' "## Features" lines are not comments.
          git commit --cleanup=verbatim -F "$RUNNER_TEMP/msg"
          git show --stat HEAD
          git bundle create bump.bundle release "^$SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: bump
          path: |
            bump.bundle
            notes.md
          retention-days: 7
          if-no-files-found: error

  stick:
    needs: bump
    uses: ./.github/workflows/stick.yml
    with:
      bump_artifact: bump
    secrets: inherit
    permissions:
      contents: read

  publish:
    needs: [plan, bump, stick]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: bump
      - uses: actions/download-artifact@v4
        with:
          name: stick
      - name: Check out the bump commit
        run: |
          git fetch ./bump.bundle 'refs/heads/*:refs/remotes/bump/*'
          git checkout --detach bump/release
          test "$(git rev-parse HEAD^)" = "$SHA"
      - name: Unpack the image
        run: mkdir -p dist && tar -C dist -xf stick.tar && rm stick.tar
      - name: Package the release files
        run: uv run python tools/package_release.py dist/stick/.ytop release
      - name: Tag the bump commit (locally)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # verbatim: the notes' "## Features" lines are not comments.
          git tag -a "$TAG" --cleanup=verbatim -F notes.md bump/release
      - name: Show what would be released (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run: would push $TAG ($(git rev-parse bump/release)) on top of $SHA"
          grep -h '^version = ' pyproject.toml
          grep -h '^__version__ = ' src/ytop/__init__.py
          git show --stat bump/release
          ls -l release/
      - name: Push the bump commit and the tag
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          bump=$(git rev-parse bump/release)
          remote=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          if [ "$remote" = "$bump" ]; then
            echo "origin already has $TAG at $bump (a re-run); not pushing again"
            exit 0
          fi
          if ! git push --atomic origin bump/release:refs/heads/main "refs/tags/$TAG"; then
            echo "::error::push rejected: main moved past $SHA (or $TAG already exists). Nothing was pushed; the next CI run on main will release."
            exit 1
          fi
      - name: Create the GitHub release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" release/* --title "YTOP $TAG" --notes-file notes.md --verify-tag
